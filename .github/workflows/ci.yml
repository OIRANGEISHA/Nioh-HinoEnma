name: Portable source and builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact Git blob bytes
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up verification Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install isolated verification dependencies
        run: |
          python -m pip install --disable-pip-version-check --target artifacts/python-deps -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw 'Verification dependency installation failed.' }
          "PYTHONPATH=$((Resolve-Path artifacts/python-deps).Path)" >> $env:GITHUB_ENV
          $version = Get-Content -LiteralPath version.json -Raw | ConvertFrom-Json
          "RELEASE_STEM=Nioh-HinoEnma-$($version.version)" >> $env:GITHUB_ENV

      - name: Verify generated source, CT and public CPU regressions
        run: |
          python tools/verify_beta613_items.py
          if ($LASTEXITCODE -ne 0) { throw 'Warm-item payload equivalence failed.' }
          python tools/build_profile.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Generated profile differs.' }
          python tools/check_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Portable source or CT checks failed.' }
          python tools/run_beta613_regressions.py --report artifacts/beta613/regression-tests.json
          if ($LASTEXITCODE -ne 0) { throw 'Complete exact-source regressions failed.' }
          python tools/verify_beta613_ct.py --report artifacts/beta613/ct-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Current CT verification failed.' }

      - name: Build Debug and optimized x64 Release
        run: |
          ./tools/build.ps1 -Configuration Debug -ArtifactRoot artifacts/beta613
          if ($LASTEXITCODE -ne 0) { throw 'Debug build failed.' }
          ./tools/build.ps1 -Configuration Release -ArtifactRoot artifacts/beta613
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }

      - name: Verify both build profiles and self-checks
        run: |
          python tools/verify_beta613.py --exe "artifacts/beta613/Debug/${env:RELEASE_STEM}-windows-x64.exe" --report artifacts/beta613/Debug/verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Debug verification failed.' }
          python tools/verify_beta613.py --exe "artifacts/beta613/Release/${env:RELEASE_STEM}-windows-x64.exe" --report artifacts/beta613/Release/verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Release verification failed.' }
