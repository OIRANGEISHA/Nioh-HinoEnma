name: Publish payload-verified Beta 6.1.3

on:
  push:
    branches: [main]
    paths: [version.json, .github/workflows/release.yml, .github/workflows/ci.yml]
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit SHA
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-beta613
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'OIRANGEISHA/Nioh-HinoEnma' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_STEM: Nioh-HinoEnma-1.0.0-beta.6.1.3
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact Git blob bytes
        run: git config --global core.autocrlf false

      - name: Check out the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Restrict publication to the authorized version and assets
        id: scope
        env:
          EXPECTED_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_commit || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          'run=false' >> $env:GITHUB_OUTPUT
          $version = Get-Content -LiteralPath version.json -Raw | ConvertFrom-Json
          if ($version.version -cne '1.0.0-beta.6.1.3') { exit 0 }
          $source = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $source -cne $env:GITHUB_SHA -or $source -cne $env:EXPECTED_COMMIT -or $source -cnotmatch '^[0-9a-f]{40}$') { throw 'Exact source commit mismatch.' }
          $publication = Get-Content -LiteralPath docs/beta613-publication.json -Raw | ConvertFrom-Json
          if ($publication.publication_authorized -ne $true -or $publication.repository -cne 'OIRANGEISHA/Nioh-HinoEnma' -or $publication.version -cne $version.version -or $publication.tag -cne 'v1.0.0-beta.6.1.3' -or $publication.asset_commit -cne '2ff0b2e0ae0963d8ed95a46816e98215c5dd9de8' -or $publication.executable_sha256 -cne '92a3440150efd53194f9683c7c6c2ced91a367d0a4c68b4a29d69ee83f57ea45') { throw 'Authorized exact file scope differs.' }
          if ((Get-FileHash -LiteralPath profiles/steam-1.24.8.json -Algorithm SHA256).Hash.ToLowerInvariant() -cne '7204b9bd34a16e75b2b72b3101c47a599f0ef22a94ae2dd4eefc8bb2018957c5') { throw 'Versioned profile changed.' }
          'run=true' >> $env:GITHUB_OUTPUT

      - name: Check out only the immutable versioned assets
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2ff0b2e0ae0963d8ed95a46816e98215c5dd9de8
          path: artifacts/asset-source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up verification Python
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install isolated offline verification dependencies
        if: steps.scope.outputs.run == 'true'
        run: |
          python -m pip install --disable-pip-version-check --target artifacts/python-deps -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }
          "PYTHONPATH=$((Resolve-Path artifacts/python-deps).Path)" >> $env:GITHUB_ENV

      - name: Verify source, CT and all 409 current regressions
        if: steps.scope.outputs.run == 'true'
        run: |
          python tools/verify_beta613_items.py
          if ($LASTEXITCODE -ne 0) { throw 'Warm-item payload equivalence failed.' }
          python tools/build_profile.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Generated source differs.' }
          python tools/check_source.py | Set-Content -LiteralPath artifacts/beta613/source-checks.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Source check failed.' }
          python tools/verify_beta613_ct.py --report artifacts/beta613/ct-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'CT verification failed.' }
          python tools/run_beta613_regressions.py --report artifacts/beta613/regression-tests.json
          if ($LASTEXITCODE -ne 0) { throw 'Current regressions failed.' }

      - name: Rebuild and verify both configurations as offline evidence
        if: steps.scope.outputs.run == 'true'
        run: |
          ./tools/build.ps1 -Configuration Debug -ArtifactRoot artifacts/beta613
          if ($LASTEXITCODE -ne 0) { throw 'Debug build failed.' }
          ./tools/build.ps1 -Configuration Release -ArtifactRoot artifacts/beta613
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
          python tools/verify_beta613.py --exe "artifacts/beta613/Debug/${env:RELEASE_STEM}-windows-x64.exe" --report artifacts/beta613/Debug/verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Debug comparison failed.' }
          python tools/verify_beta613.py --exe "artifacts/beta613/Release/${env:RELEASE_STEM}-windows-x64.exe" --report artifacts/beta613/Release/verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Release comparison failed.' }

      - name: Package verified versioned EXE and final committed UTF-8 source
        if: steps.scope.outputs.run == 'true'
        run: |
          python .github/scripts/publish_beta613.py --asset-dir artifacts/asset-source --prepare-only
          if ($LASTEXITCODE -ne 0) { throw 'Exact asset/source preparation failed.' }

      - name: Verify Draft downloads and publish the authorized Pre-release
        if: steps.scope.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/publish_beta613.py --asset-dir artifacts/asset-source --publish
          if ($LASTEXITCODE -ne 0) { throw 'Publication stopped; preserve Draft and inspect readback.' }
          $receipt = Get-Content -LiteralPath artifacts/publish-beta613/publication-readback.json -Raw | ConvertFrom-Json
          "Verified published Beta 6.1.3: $($receipt.url). The verified local versioned EXE and all source/asset downloads were verified." >> $env:GITHUB_STEP_SUMMARY
